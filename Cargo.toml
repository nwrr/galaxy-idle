[package]
name = "galaxy-idle"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
# portrait PNG; v3–9 = ratatui 0.29 (spec "1" usang → tarik ratatui 0.30). default-features off
# → tanpa chafa (lib sistem); halfblock/sixel/kitty tetap ada.
ratatui-image = { version = "9", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"        # decode PNG portrait
ansi-to-tui = "7"     # parse .ans sprite celestial half-block → ratatui Text/Style
