[package]
name = "galaxy-idle"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
ratatui-image = "1"   # render portrait karakter (PNG) di terminal
image = "0.25"        # decode PNG portrait
ansi-to-tui = "7"     # parse .ans sprite celestial half-block → ratatui Text/Style
